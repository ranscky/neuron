name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repo has three independent Go modules (cli, registry, cloud), each with
# its own go.mod. They are built, vetted and tested separately so a failure in
# one does not mask the others.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cli, registry, cloud]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Glob so modules without a go.sum (registry) don't break caching.
          cache-dependency-path: '**/go.sum'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
